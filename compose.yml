services:
  mock-couic:
    # More recent version have bug: https://github.com/stoplightio/prism/issues/2763
    image: stoplight/prism:5.15.10@sha256:586d1f0f94f8d0eaf20b26b8b41f985f2a2d494bea297bd3988c3de3eb87094e
    command:
      - "mock"
      - "https://raw.githubusercontent.com/FCSC-FR/couic/refs/heads/main/website/static/json/openapi.json"
      - "--host=0.0.0.0"
      - "--port=4010"
  mock-couic-socket:
    image: alpine/socat:1.8.1.3@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287
    volumes:
      - type: volume
        source: couic-socket
        target: /var/run
    command:
      - UNIX-LISTEN:/var/run/couic.sock,fork
      - TCP:mock-couic:4010
  honeycut:
    image: golang:1.26-alpine
    develop:
      watch:
        - action: sync+restart
          path: ./main.go
          target: /src/main.go
          initial_sync: true
    volumes:
      - type: volume
        source: couic-socket
        target: /var/run
    ports:
      - host_ip: "127.0.0.1"
        published: 8080
        target: 8080
        protocol: tcp
    environment:
      COUIC_SOCKET_PATH: /var/run/couic.sock
      COUIC_API_TOKEN: placeholder
    command:
      - go
      - run
      - /src/main.go
volumes:
  couic-socket:
